{% extends 'patient/sidebar.html' %}
{% block body %}

<div class="container mt-5">

<form method="post"
      enctype="multipart/form-data">

{% csrf_token %}

<div class="form-group">
    <label>Date</label>
    <input type="date"
           class="form-control"
           name="date"
           required>
</div>

<div class="form-group">
    <label>Description</label>
    <textarea class="form-control"
              name="desc"
              required></textarea>
</div>

<div class="form-group">
    <label>Upload Report</label>
    <input type="file"
           class="form-control"
           name="file"
           required>
</div>

<button type="submit"
        class="btn btn-primary">
    Upload Report
</button>

</form>

</div>

{% endblock %}
